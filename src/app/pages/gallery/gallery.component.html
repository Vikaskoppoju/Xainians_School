<section class="page-hero page-hero--media">
  <div class="page-hero__bg">
    <img src="assets/gallery/graduation-group.jpg" alt="Students celebrating at a school event" loading="eager" />
    <div class="page-hero__scrim"></div>
  </div>
  <div class="container page-hero__content">
    <h1>Gallery</h1>
    <p>Moments from Graduation Day, our AI &amp; Robotics Lab, picnics, and everyday life on campus.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="filters">
      <button type="button" *ngFor="let c of categories" [class.active]="active === c" (click)="setActive(c)">
        {{ c }}
      </button>
    </div>

    <div class="grid grid--4 gallery-grid">
      <div class="gallery-item" *ngFor="let item of filtered">
        <div class="gallery-item__thumb">
          <img [src]="item.img" [alt]="item.title" loading="lazy" />
        </div>
        <p>{{ item.title }}</p>
      </div>
    </div>
  </div>
</section>
