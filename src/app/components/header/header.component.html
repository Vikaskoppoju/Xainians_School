<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="topbar">
  <div class="container topbar__inner">
    <div class="topbar__contact">
      <a href="tel:+911234567890">+91 12345 67890</a>
      <a href="mailto:info@xainiansschool.edu.in">info&#64;xainiansschool.edu.in</a>
      <span>Batengoo, Anantnag, J&amp;K</span>
    </div>
    <div class="topbar__tools">
      <button type="button" (click)="toggleTextSize()" [class.active]="largeText" title="Toggle large text">A+</button>
      <button type="button" (click)="toggleContrast()" [class.active]="highContrast" title="Toggle high contrast">◐</button>
      <button type="button" (click)="toggleLanguage()" [class.active]="isUrdu" title="Toggle language">
        {{ isUrdu ? 'اردو' : 'EN' }}
      </button>
      <span class="topbar__socials">
        <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook">Facebook</a>
        <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">Instagram</a>
        <a href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube">YouTube</a>
      </span>
    </div>
  </div>
</div>

<header class="site-header" [class.scrolled]="scrolled">
  <div class="container site-header__inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <div class="brand__logo">XI</div>
      <div class="brand__text">
        <strong>Xainians International School</strong>
        <span>Batengoo, Anantnag</span>
      </div>
    </a>

    <nav class="nav" [class.open]="menuOpen" aria-label="Primary">
      <div class="nav__item" *ngFor="let link of navLinks"
           (mouseenter)="link.mega && openMegaMenu(link.label)" (mouseleave)="link.mega && closeMegaMenu()">
        <a [routerLink]="link.path" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: link.path === '/' }"
           (click)="link.mega ? toggleMegaMenu(link.label) : closeMenu()">
          {{ link.label }}
          <svg *ngIf="link.mega" class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </a>

        <div class="mega" *ngIf="link.mega && openMega === link.label">
          <div class="mega__links">
            <a *ngFor="let m of link.mega" [routerLink]="m.path" (click)="closeMenu()">
              <strong>{{ m.label }}</strong>
              <span>{{ m.desc }}</span>
            </a>
          </div>
          <div class="mega__media" *ngIf="link.megaImage">
            <img [src]="link.megaImage" [alt]="link.megaImageAlt" loading="lazy" />
          </div>
        </div>
      </div>

      <a routerLink="/parent-portal" class="nav__portal" routerLinkActive="active" (click)="closeMenu()">Parent Portal</a>
    </nav>

    <div class="header-actions">
      <button type="button" class="icon-btn" (click)="toggleSearch()" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <a routerLink="/admissions" class="btn btn--primary header-actions__cta">Apply Now</a>
      <button type="button" class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="search-bar" *ngIf="searchOpen">
    <div class="container search-bar__inner">
      <input type="search" placeholder="Search syllabus, fee structure, notices..." [(ngModel)]="searchTerm"
             (keyup.enter)="runSearch()" autofocus />
      <button type="button" class="btn btn--primary" (click)="runSearch()">Search</button>
    </div>
  </div>
</header>
